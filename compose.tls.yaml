# Optional: direct access when router ports 80/443 reach this server.
services:
  tls:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-telegadocs.ru}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [proxy]
volumes:
  caddy_data:
  caddy_config:
