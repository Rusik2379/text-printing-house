name: tekst-site
services:
  app:
    image: ${APP_IMAGE:-tekst-site-app:latest}
    build: .
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS address}
      ADMIN_DATA_DIR: /data
      TRUST_PROXY: "1"
      ORDERS_RETENTION_DAYS: ${ORDERS_RETENTION_DAYS:-30}
      ORDERS_STORAGE_MB: ${ORDERS_STORAGE_MB:-4096}
    volumes:
      - tekst_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8083}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  tekst_data:
