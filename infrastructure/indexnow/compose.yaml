name: tekst-indexnow
services:
  monitor:
    build: .
    image: tekst-indexnow:20261026
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    volumes:
      - ./config:/config:ro
      - ./data:/data
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "3"}
